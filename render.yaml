services:
  - type: web
    name: learnflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: CORS_ORIGINS
        sync: false

